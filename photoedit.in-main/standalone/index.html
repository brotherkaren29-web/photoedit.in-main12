<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>photoedit.in — Screenshot Editor</title>
  <style>
    :root{--bg:#12151b;--panel:#1b2028;--line:#303947;--text:#edf1f5;--muted:#93a0b0;--lime:#c9f269;--pink:#ff4d6d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Arial,sans-serif;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.top{height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#171b21;border-bottom:1px solid var(--line)}.logo{font-weight:bold;font-size:17px;margin-right:18px}.logo b{display:inline-grid;place-items:center;background:var(--lime);color:#172016;border-radius:6px;width:25px;height:25px;margin-right:7px;font:20px Georgia}.top button,.tool{border:0;border-radius:5px;background:#29323d;color:var(--text);padding:8px 11px;cursor:pointer}.top button:hover,.tool:hover,.tool.active{background:var(--lime);color:#152016}.top .secondary{margin-left:auto}.tools{display:flex;gap:4px;align-items:center;padding:8px 12px;background:#1d232c;border-bottom:1px solid var(--line);overflow:auto}.tool{white-space:nowrap;background:transparent;color:var(--muted);padding:7px 10px}.stage{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:24px;background-color:#151a20;background-image:linear-gradient(45deg,#1d232c 25%,transparent 25%),linear-gradient(-45deg,#1d232c 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1d232c 75%),linear-gradient(-45deg,transparent 75%,#1d232c 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}.frame{width:min(900px,92vw);aspect-ratio:3/2;box-shadow:0 16px 50px #080a0e}.frame canvas{display:block;width:100%;height:100%;background:#26303b;touch-action:none}.bottom{height:35px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 15px;color:var(--muted);font-size:11px}.bottom span:nth-child(2){margin:auto}@media(max-width:700px){.top{padding:0 8px;gap:5px}.logo{margin-right:4px}.top .secondary{margin-left:0}.top button{padding:7px}.stage{place-items:start center;padding:16px 8px}.frame{width:calc(100vw - 16px)}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="logo"><b>p</b>photoedit<span style="color:var(--lime)">.in</span></div><button id="upload">Open screenshot</button><button id="paste">Paste</button><button id="capture">Capture screen</button><button id="rotate">Rotate</button><button class="secondary" id="download">Download PNG</button><input id="file" type="file" accept="image/*" hidden></header>
  <nav class="tools" aria-label="Screenshot tools"><button class="tool active" data-tool="select">Select</button><button class="tool" data-tool="crop">Crop</button><button class="tool" data-tool="resize">Resize</button><button class="tool" data-tool="brush">Pen</button><button class="tool" data-tool="arrow">Arrow</button><button class="tool" data-tool="rect">Rectangle</button><button class="tool" data-tool="circle">Circle</button><button class="tool" data-tool="text">Text</button><button class="tool" data-tool="highlight">Highlight</button><button class="tool" data-tool="blur">Blur / Pixelate</button><button class="tool" id="undo">Undo</button><button class="tool" id="redo">Redo</button></nav>
  <section class="stage"><div class="frame"><canvas id="canvas" width="900" height="600"></canvas></div></section><footer class="bottom"><span id="size">900 × 600 px</span><span>All edits merge into the screenshot</span><span>photoedit.in</span></footer>
</main>
<script>
const c=document.getElementById('canvas'),x=c.getContext('2d'),file=document.getElementById('file');let tool='select',start=null,drawing=false,undo=[],redo=[];const img=new Image();img.crossOrigin='anonymous';img.src='https://images.unsplash.com/photo-1604871000636-074fa5117945?crop=entropy&cs=srgb&fm=jpg&q=85';img.onload=()=>drawImage(img);
function drawImage(i){x.clearRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);save()};function save(){undo.push(c.toDataURL());if(undo.length>20)undo.shift();redo=[]}function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(q=>q.classList.toggle('active',q===b));if(tool==='text'){const t=prompt('Screenshot text');if(t){x.font='bold 32px Arial';x.fillStyle='#fff';x.shadowColor='#000';x.shadowBlur=5;x.fillText(t,60,90);save()}}if(tool==='crop'){const p=Number(prompt('Crop percentage','80'));if(p>=25&&p<=100){const z=document.createElement('canvas');z.width=c.width;z.height=c.height;z.getContext('2d').drawImage(c,0,0);x.clearRect(0,0,c.width,c.height);x.drawImage(z,(c.width-c.width*p/100)/2,(c.height-c.height*p/100)/2,c.width*p/100,c.height*p/100);save()}}if(tool==='resize'){const w=Number(prompt('New width','1200'));if(w>=200&&w<=4000){const z=document.createElement('canvas');z.width=w;z.height=Math.round(w*2/3);z.getContext('2d').drawImage(c,0,0,w,z.height);c.width=w;c.height=z.height;x.drawImage(z,0,0);save();document.getElementById('size').textContent=w+' × '+z.height+' px'}}});
c.onpointerdown=e=>{if(['select','crop','resize','text'].includes(tool))return;drawing=true;start=point(e);if(tool==='brush'){x.beginPath();x.moveTo(start.x,start.y);x.strokeStyle='#ff4d6d';x.lineWidth=5;x.lineCap='round'}};c.onpointermove=e=>{if(drawing&&tool==='brush'){const p=point(e);x.lineTo(p.x,p.y);x.stroke()}};c.onpointerup=e=>{if(!drawing)return;drawing=false;const p=point(e),w=p.x-start.x,h=p.y-start.y;x.save();if(tool==='arrow'){x.strokeStyle='#ff4d6d';x.lineWidth=6;x.beginPath();x.moveTo(start.x,start.y);x.lineTo(p.x,p.y);x.stroke();x.fillStyle='#ff4d6d';x.beginPath();x.arc(p.x,p.y,9,0,Math.PI*2);x.fill()}if(tool==='rect'){x.strokeStyle='#6aa6ff';x.lineWidth=4;x.strokeRect(start.x,start.y,w,h)}if(tool==='circle'){x.strokeStyle='#6aa6ff';x.lineWidth=4;x.beginPath();x.ellipse(start.x+w/2,start.y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2);x.stroke()}if(tool==='highlight'){x.fillStyle='rgba(255,220,70,.4)';x.fillRect(start.x,start.y,w,h)}if(tool==='blur'){x.fillStyle='rgba(15,20,30,.78)';x.fillRect(Math.min(start.x,p.x),Math.min(start.y,p.y),Math.abs(w),Math.abs(h))}x.restore();save()};
document.getElementById('upload').onclick=()=>file.click();file.onchange=e=>{const i=new Image();i.onload=()=>{c.width=900;c.height=600;drawImage(i)};i.src=URL.createObjectURL(e.target.files[0])};document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.download='photoedit-screenshot.png';a.href=c.toDataURL();a.click()};document.getElementById('rotate').onclick=()=>{const z=document.createElement('canvas');z.width=c.height;z.height=c.width;z.getContext('2d').translate(z.width/2,z.height/2);z.getContext('2d').rotate(Math.PI/2);z.getContext('2d').drawImage(c,-c.width/2,-c.height/2);c.width=z.width;c.height=z.height;x.drawImage(z,0,0);save()};document.getElementById('undo').onclick=()=>{if(undo.length<2)return;redo.push(undo.pop());const i=new Image();i.onload=()=>x.drawImage(i,0,0,c.width,c.height);i.src=undo[undo.length-1]};document.getElementById('redo').onclick=()=>{if(!redo.length)return;const data=redo.pop();undo.push(data);const i=new Image();i.onload=()=>x.drawImage(i,0,0,c.width,c.height);i.src=data};document.getElementById('paste').onclick=async()=>{try{const items=await navigator.clipboard.read();for(const item of items){const t=item.types.find(v=>v.startsWith('image/'));if(t){const i=new Image();i.onload=()=>drawImage(i);i.src=URL.createObjectURL(await item.getType(t));return}}}catch(e){alert('Clipboard permission required')}};document.getElementById('capture').onclick=async()=>{try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});const v=document.createElement('video');v.srcObject=s;await v.play();setTimeout(()=>{c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);s.getTracks().forEach(t=>t.stop());save()},500)}catch(e){}};
</script></body></html>
